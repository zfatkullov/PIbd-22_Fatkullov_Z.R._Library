<text x="744" y="673" font-size="15">ReturnedOn : DateTime</text>
<g font-size="16">
<text x="30" y="785">Справочники: Reader, Librarian, Publication. Операции: Loan, ReturnRecord.</text>
<text x="30" y="817">Loan ↔ Publication: многие-ко-многим через LoanItem; один источник — один экземпляр.</text>
<text x="30" y="849">PublicationKind: Book / Magazine. Subject: Fiction=1, Science=2, History=4, Technology=8.</text>
<text x="30" y="881">PK — первичный ключ, FK — внешний ключ, UK — уникальность (проектируемая БД).</text>
<text x="30" y="913">В лабораторной № 1 БД и хранение не реализуются: используются репозитории-заглушки.</text>
</g></g></svg>
